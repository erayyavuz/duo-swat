<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo Swat</title>
<meta name="description" content="Catch the fly by snapping a foldable phone shut. An interactive Three.js toy.">
<meta name="theme-color" content="#1a1712">
<meta property="og:title" content="Duo Swat">
<meta property="og:description" content="Catch the fly by snapping a foldable phone shut.">
<meta property="og:image" content="https://erayyavuz.github.io/duo-swat/assets/og.jpg">
<meta property="og:url" content="https://erayyavuz.github.io/duo-swat/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='20' cy='22' rx='16' ry='8' fill='%23c9d3dc' opacity='.8' transform='rotate(-25 20 22)'/%3E%3Cellipse cx='44' cy='22' rx='16' ry='8' fill='%23c9d3dc' opacity='.8' transform='rotate(25 44 22)'/%3E%3Cellipse cx='32' cy='38' rx='10' ry='14' fill='%23302c27'/%3E%3Ccircle cx='26' cy='24' r='6' fill='%238a2414'/%3E%3Ccircle cx='38' cy='24' r='6' fill='%238a2414'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-label="A hand holding a foldable phone, and a fly buzzing around"></canvas>

<div class="veil" id="veil"></div>

<header class="hud">
  <div class="brand">Duo&nbsp;Swat</div>
  <div class="score" aria-live="polite">
    <span><b id="caught">0</b> caught</span>
    <span class="dot">·</span>
    <span><b id="missed">0</b> missed</span>
  </div>
</header>

<div class="hint" id="hint">Move to aim · <span class="k-mouse">click</span><span class="k-touch">tap</span> to snap it shut</div>
<div class="toast" id="toast"></div>

<footer class="foot">
  <div class="swatches" role="radiogroup" aria-label="Finish">
    <button class="sw active" data-finish="night" aria-label="Night Sky" role="radio" aria-checked="true"><i style="--c:#262d3d"></i></button>
    <button class="sw" data-finish="white" aria-label="Star White" role="radio" aria-checked="false"><i style="--c:#e9e6df"></i></button>
  </div>
  <button class="sound" id="sound" aria-label="Toggle sound">Sound off</button>
  <p class="fine">Fan-made toy. Not affiliated with Apple.</p>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
